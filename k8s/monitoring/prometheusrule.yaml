apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: webapp-alerts
  namespace: monitoring
spec:
  groups:
    - name: webapp.rules
      rules:
        - alert: WebappDown
          expr: sum(up{namespace="webapp"}) == 0 or absent(up{namespace="webapp"})
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Webapp has no healthy pods"
        - alert: WebappHighErrorRate
          expr: |
            sum(rate(app_requests_total{status=~"5.."}[5m]))
              / sum(rate(app_requests_total[5m])) > 0.05
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "More than 5% of webapp requests are failing"
